<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spoiler Shield for Google Chrome</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f9f9f9;
            margin: 0;
            padding: 40px 0;
        }

        /* Contenitore principale con margine sinistro e superiore del 10% */
        .container {
            margin-top: 10vh;
            margin-left: 10%;
            margin-right: 5%;
            max-width: 800px;
        }

        h1 {
            font-size: 2.5rem;
            color: #111;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #666;
            margin-top: 0;
            margin-bottom: 40px;
        }

        /* Stile della lista dei link */
        ul {
            list-style: none;
            padding: 0;
            margin-bottom: 60px;
        }

        li {
            margin-bottom: 15px;
        }

        a {
            color: #0366d6;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.1rem;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Stile del footer */
        footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #666;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        footer a {
            color: #666;
            font-size: 0.9rem;
            font-weight: normal;
        }

        /* Ottimizzazione per schermi piccoli (Smartphone) */
        @media (max-width: 600px) {
            .container {
                margin-top: 5vh; /* Riduce il margine superiore sui telefoni */
                margin-left: 5%; /* Riduce il margine sinistro sui telefoni */
                margin-right: 5%;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Titolo e Sottotitolo -->
        <h1>Spoiler Shield for Google Chrome</h1>
        <p class="subtitle">Developed by MK Web Studio</p>

        <!-- Menu Link -->
        <ul>
            <li><a href="license.html">License</a></li>
            <li><a href="privacy.html">Privacy</a></li>
            <li><a href="download.html">Download</a></li>
        </ul>

        <!-- Footer con Copyright -->
        <footer>
            <p>All Rights Reserved &copy; 2026 - <a href="https://mkwebstudio.com" target="_blank">Mk Web Studio</a></p>
        </footer>
    </div>

</body>
</html>
